name: Validate Recommendation Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-recommendations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate syntax and offline tests
        run: npm run check && npm test
