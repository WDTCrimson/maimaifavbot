<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maimai Playlist</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="antialiased">
    <main class="app">
      <header class="hero">
        <p class="kicker">maimai tools</p>
        <h1>Playlist Control</h1>
        <p class="subtitle">Apply payloads, or export current favorites into a bot import code.</p>
      </header>
      <section class="panel">
        <label class="field-label" for="payload">Payload / Import Code</label>
        <textarea id="payload" placeholder="Paste payload here..."></textarea>
        <div class="toggles">
          <label class="toggle">
            <input id="strict" type="checkbox" />
            Strict sync (also remove songs not in playlist)
          </label>
          <label class="toggle">
            <input id="autoSubmit" type="checkbox" checked />
            Auto-click DECIDE after apply
          </label>
        </div>
        <div class="actions">
          <button id="apply" class="btn btn-primary">Apply To Current Tab</button>
          <button id="export" class="btn btn-secondary">Export Current Favorites</button>
        </div>
      </section>
      <div id="status" data-tone="neutral">Ready.</div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
